# Build and push Dipolar images to GitHub Container Registry (ghcr.io).
# After this runs, Unraid (and others) can pull without building locally.
name: Docker publish to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dipolar-server:latest
            ghcr.io/${{ github.repository_owner }}/dipolar-server:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List repo root (for debugging)
        run: ls -la && test -f package.json && test -f Dockerfile && echo "package.json and Dockerfile present"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dipolar-app:latest
            ghcr.io/${{ github.repository_owner }}/dipolar-app:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
