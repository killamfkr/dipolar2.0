# Full-stack Dipolar: app (React + nginx) + API server.
# From repo root: docker compose up -d
# Open http://localhost:3000 (or http://YOUR_IP:3000) for the app; /api is proxied to the server.
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: dipolar-server:latest
    container_name: dipolar-server
    ports:
      - "3333:3333"
    expose:
      - "3333"
    environment:
      - PORT=3333
      - NODE_ENV=production
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dipolar-app:latest
    container_name: dipolar-app
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    restart: unless-stopped
